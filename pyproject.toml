[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lazychat_erpnext"
version = "0.2.7"
description = "Multi-provider AI assistant panel for ERPNext desk"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Soumya Sethy", email = "sethy.soumyaranjan@gmail.com" },
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/soumyasethy/lazychat-erpnext"
Issues = "https://github.com/soumyasethy/lazychat-erpnext/issues"

# Frappe Cloud reads this to pick the compatible Frappe version track.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["lazychat_erpnext", "lazychat_erpnext.*"]
namespaces = false
