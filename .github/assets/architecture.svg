<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#b85a3d"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="440" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#111">lazychat-erpnext — request flow</text>

  <!-- Browser column -->
  <text x="120" y="62" text-anchor="middle" font-size="13" fill="#888" font-weight="600" letter-spacing="1">BROWSER</text>

  <rect x="20" y="78" width="200" height="86" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="120" y="105" text-anchor="middle" font-weight="600" fill="#111">ERPNext Desk</text>
  <text x="120" y="125" text-anchor="middle" fill="#555" font-size="13">/app/* routes</text>
  <text x="120" y="143" text-anchor="middle" fill="#555" font-size="13">app_include_js loads shim</text>

  <rect x="20" y="186" width="200" height="86" rx="8" fill="#fff7f3" stroke="url(#brand)" stroke-width="2"/>
  <text x="120" y="213" text-anchor="middle" font-weight="600" fill="#111">panel-shim</text>
  <text x="120" y="233" text-anchor="middle" fill="#555" font-size="13">lazychat_panel.bundle.js</text>
  <text x="120" y="251" text-anchor="middle" fill="#555" font-size="13">FAB · postMessage · /commit</text>

  <rect x="20" y="294" width="200" height="120" rx="8" fill="#fff7f3" stroke="url(#brand)" stroke-width="2"/>
  <text x="120" y="321" text-anchor="middle" font-weight="600" fill="#111">chat-ui iframe</text>
  <text x="120" y="341" text-anchor="middle" fill="#555" font-size="13">lazychat_dist/index.html</text>
  <text x="120" y="359" text-anchor="middle" fill="#555" font-size="13">React + Zustand</text>
  <text x="120" y="377" text-anchor="middle" fill="#555" font-size="13">Apply cards · Plan mode</text>
  <text x="120" y="395" text-anchor="middle" fill="#555" font-size="13">live tool dispatch UI</text>

  <!-- Frappe column -->
  <text x="440" y="62" text-anchor="middle" font-size="13" fill="#888" font-weight="600" letter-spacing="1">FRAPPE BACKEND</text>

  <rect x="320" y="78" width="240" height="86" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="440" y="105" text-anchor="middle" font-weight="600" fill="#111">api.send_message_stream</text>
  <text x="440" y="125" text-anchor="middle" fill="#555" font-size="13">SSE · backend-LLM path</text>
  <text x="440" y="143" text-anchor="middle" fill="#555" font-size="13">runs LLM in Frappe process</text>

  <rect x="320" y="186" width="240" height="86" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="440" y="213" text-anchor="middle" font-weight="600" fill="#111">mcp.handle (JSONRPC)</text>
  <text x="440" y="233" text-anchor="middle" fill="#555" font-size="13">browser-LLM tool dispatch</text>
  <text x="440" y="251" text-anchor="middle" fill="#555" font-size="13">also: external MCP clients</text>

  <rect x="320" y="294" width="240" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="321" text-anchor="middle" font-weight="600" fill="#111">tools.py · 94 tools</text>
  <text x="440" y="341" text-anchor="middle" fill="#555" font-size="13">runs as frappe.session.user</text>
  <text x="440" y="359" text-anchor="middle" fill="#555" font-size="13">permission re-check per call</text>
  <text x="440" y="377" text-anchor="middle" fill="#555" font-size="13">prepare_* stages → token</text>
  <text x="440" y="395" text-anchor="middle" fill="#555" font-size="13">commit_prepared_action applies</text>

  <!-- LLM column -->
  <text x="760" y="62" text-anchor="middle" font-size="13" fill="#888" font-weight="600" letter-spacing="1">LLM PROVIDERS</text>

  <rect x="640" y="78" width="220" height="194" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="750" y="105" text-anchor="middle" font-weight="600" fill="#111">Backend-LLM</text>
  <text x="750" y="125" text-anchor="middle" fill="#555" font-size="13">via LLM Provider doctype</text>
  <text x="750" y="148" text-anchor="middle" fill="#444" font-size="13">Anthropic · OpenAI · NVIDIA</text>
  <text x="750" y="166" text-anchor="middle" fill="#444" font-size="13">OpenRouter · Vercel AI</text>
  <text x="750" y="184" text-anchor="middle" fill="#444" font-size="13">Groq · Together · LM Studio</text>
  <text x="750" y="208" text-anchor="middle" fill="#888" font-size="12">key stored on server</text>

  <line x1="640" y1="222" x2="860" y2="222" stroke="#e5e7eb" stroke-dasharray="3 3"/>

  <text x="750" y="244" text-anchor="middle" font-weight="600" fill="#111">Browser-LLM (BYO)</text>
  <text x="750" y="262" text-anchor="middle" fill="#555" font-size="13">key in localStorage</text>

  <rect x="640" y="294" width="220" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="750" y="321" text-anchor="middle" font-weight="600" fill="#111">Composer-Critic</text>
  <text x="750" y="341" text-anchor="middle" fill="#555" font-size="13">Effort=high → haiku-4-5</text>
  <text x="750" y="359" text-anchor="middle" fill="#555" font-size="13">Effort=max → sonnet-4-6</text>
  <text x="750" y="377" text-anchor="middle" fill="#555" font-size="13">verdict on every prepare_*</text>
  <text x="750" y="395" text-anchor="middle" fill="#555" font-size="13">amber strip if mismatch</text>

  <!-- Arrows: Desk → shim → iframe -->
  <line x1="120" y1="164" x2="120" y2="184" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="272" x2="120" y2="292" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Iframe → mcp.handle (browser-LLM) -->
  <line x1="220" y1="334" x2="318" y2="220" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="270" font-size="12" fill="#888">browser path</text>

  <!-- shim → send_message_stream (backend-LLM) -->
  <line x1="220" y1="220" x2="318" y2="120" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="155" font-size="12" fill="#888">backend path</text>

  <!-- send_message_stream / mcp.handle → tools.py -->
  <line x1="440" y1="164" x2="440" y2="184" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="272" x2="440" y2="292" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- send_message_stream → backend LLM provider -->
  <line x1="560" y1="120" x2="638" y2="120" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- iframe → browser LLM (lower) -->
  <path d="M 220 380 C 280 470, 600 460, 750 414" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="450" y="465" font-size="12" fill="#888">browser-LLM via fetch</text>

  <!-- tools.py → critic -->
  <line x1="560" y1="354" x2="638" y2="354" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="588" y="345" font-size="12" fill="#888">verdict</text>
</svg>
