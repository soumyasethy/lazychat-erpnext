<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 248" width="720" height="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="KPI cards · live from chat">
