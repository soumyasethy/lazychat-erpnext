name: release

# Build the chat-ui dist on every tag push and force-push the result to the `release`
# branch. Installers can then run `bench get-app <repo> --branch release` and get a
# fully-built app — no Node/pnpm required on the install box.
#
# Trigger:  git tag v0.2.4 && git push origin v0.2.4
#
# Anyone with a Frappe bench:
#   bench get-app https://github.com/soumyasethy/lazychat-mcp-erpnext --branch release
#   bench --site <site> install-app lazychat_mcp_erpnext

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone lazychat.ai (chat-ui source)
        run: git clone --depth=1 https://github.com/soumyasethy/lazychat.ai.git ../lazychat.ai

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: ../lazychat.ai/pnpm-lock.yaml

      - name: Build chat-ui dist
        run: |
          cd ../lazychat.ai
          pnpm install --frozen-lockfile=false
          pnpm --filter chat-ui build

      - name: Bundle dist into Frappe app
        run: |
          mkdir -p lazychat_mcp_erpnext/public/lazychat_dist
          rsync -a --delete ../lazychat.ai/apps/chat-ui/dist/ lazychat_mcp_erpnext/public/lazychat_dist/
          ls -la lazychat_mcp_erpnext/public/lazychat_dist/ | head -10

      - name: Commit + force-push to release branch
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release
          # public/lazychat_dist/ is gitignored on main; force-add on release.
          git add -f lazychat_mcp_erpnext/public/lazychat_dist
          git add -A
          git commit -m "release: build dist for ${TAG_NAME}" || echo "(nothing to commit)"
          git push --force origin release
