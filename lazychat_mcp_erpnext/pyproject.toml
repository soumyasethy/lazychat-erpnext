[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lazychat_mcp_erpnext"
version = "0.2.5"
description = "Multi-provider AI assistant panel for ERPNext desk"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Soumya Sethy", email = "sethy.soumyaranjan@gmail.com" },
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/soumyasethy/lazychat-mcp-erpnext"
Issues = "https://github.com/soumyasethy/lazychat-mcp-erpnext/issues"

[tool.setuptools.packages.find]
where = ["."]
